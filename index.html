<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỉ Niệm 1 Tháng Yêu Nhau ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffebee, #fce4ec);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .welcome-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #ff8fa3, #ff4d6d);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .welcome-btn {
            padding: 15px 40px;
            font-size: 1.3em;
            color: #d81b60;
            background-color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: pulse 1.5s infinite;
        }

        .welcome-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            z-index: 5;
            transition: opacity 1s 1.2s ease;
            pointer-events: none;
        }
        .overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        
        .envelope-container {
            position: relative;
            width: 320px; 
            height: 220px;
            transform: rotate(-10deg);
            transition: transform 0.4s ease;
            cursor: pointer;
            z-index: 10;
        }

        .envelope-container:not(.open) {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(-10deg); }
            50% { transform: translateY(-10px) rotate(-10deg); }
        }

        .envelope-container:hover {
            transform: rotate(-10deg) scale(1.05);
        }

        .envelope-container.open {
            transform: rotate(0deg);
            cursor: default;
            animation: none;
        }

        /* Mặt sau phong bì */
        .env-back {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #f8c8d4;
            border: 4px solid #222;
            border-radius: 6px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 1;
        }

       
        .env-flap {
            position: absolute;
            top: 0; left: 0;
            width: 320px; height: 160px;
            transform-origin: top center;
            z-index: 4;
            transition: transform 0.6s 0.2s ease;
        }
        .envelope-container.open .env-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        
        .env-front {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        
        .heart-sticker {
            position: absolute;
            top: 120px; left: 50%;
            transform: translate(-50%, -50%);
            width: 45px; height: 45px;
            z-index: 5;
            transition: opacity 0.3s ease;
        }
        .envelope-container.open .heart-sticker {
            opacity: 0;
        }

       
        .letter {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -45%);
            width: 90%; 
            height: 200px;
            background: #fffcf2;
            border: 3px solid #222;
            border-radius: 8px;
            padding: 20px 15px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            z-index: 2;
        }

        .envelope-container.open .letter {
            animation: popOutToCenter 1.5s 0.6s forwards;
        }

        @keyframes popOutToCenter {
            0% { transform: translate(-50%, -45%) scale(1); z-index: 2; height: 190px; }
            35% { transform: translate(-50%, -240px) scale(1); z-index: 2; height: 190px; } 
            40% { transform: translate(-50%, -240px) scale(1); z-index: 10; height: 190px; } 
            100% { transform: translate(-50%, -50%) scale(1.15); z-index: 10; height: 340px; } 
        }

        .envelope-container.open .env-back,
        .envelope-container.open .env-front,
        .envelope-container.open .env-flap {
            animation: fadeOutEnvelope 0.8s 1.5s forwards;
        }

        @keyframes fadeOutEnvelope {
            to { opacity: 0; visibility: hidden; }
        }

        .letter h1 {
            color: #e91e63;
            font-size: 1.4em;
            margin: 5px 0 15px 0;
            text-align: center;
        }
        .letter p {
            color: #d81b60;
            font-size: 1em;
            line-height: 1.6;
            margin: 5px 0;
            text-align: center;
            font-weight: 500;
        }

        .instruction {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2em;
            color: #d81b60;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            transition: opacity 0.5s ease;
            z-index: 1;
            white-space: nowrap;
        }

       
        .bg-heart {
            position: absolute;
            bottom: -50px;
            width: 15px; height: 15px;
            background-color: #ff4081;
            transform: rotate(-45deg);
            animation: floatUp infinite ease-in;
            opacity: 0.6;
            z-index: 0;
        }
        .bg-heart::before, .bg-heart::after {
            content: '';
            position: absolute;
            width: 15px; height: 15px;
            background-color: #ff4081;
            border-radius: 50%;
        }
        .bg-heart::before { top: -7.5px; left: 0; }
        .bg-heart::after { top: 0; left: 7.5px; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(-45deg) scale(0.5); opacity: 1; }
            100% { transform: translateY(-110vh) rotate(-45deg) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

   
    <div class="welcome-screen" id="welcome">
        <button class="welcome-btn" id="start-btn">💌 Có một món quà dành cho em 💌</button>
    </div>

   
    <div class="overlay" id="overlay"></div>

   
    <div class="envelope-container" id="envelope">
        
        <div class="env-back"></div>
        
        <div class="letter" id="letter">
            <h1>HAPPY ANNIVERSARY❤️</h1>
            <p>Cảm ơn em đã đồng ý thành người yêu anh.</p>
            <p>Thời gian qua anh hạnh phúc lắm</p>
            <p>Hi vọng rằng chúng ta sẽ có thêm nhiều lần kỉ niệm nữa, tới già nha</p>
            <p>Cùng nhau cố gắng nha Bé iu ❤️</p>
            <p style="margin-top: 15px;"><strong>- 2T -</strong></p>
        </div>
        
        <div class="env-front">
            <svg viewBox="0 0 320 220" width="100%" height="100%">
                <path d="M0,0 L160,120 L0,220 Z" fill="#fbcad7" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
                <path d="M320,0 L160,120 L320,220 Z" fill="#fbcad7" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
                <path d="M0,220 L160,120 L320,220 Z" fill="#fac3d2" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
            </svg>
        </div>
        
        <div class="env-flap" id="flap">
            <svg viewBox="0 0 320 160" width="100%" height="100%">
                <path d="M0,0 L160,140 L320,0 Z" fill="#f8c8d4" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
            </svg>
        </div>
        
        <div class="heart-sticker" id="heart">
            <svg viewBox="0 0 32 32" width="100%" height="100%">
                <path d="M16,28 C16,28 3,20 3,10 C3,4 10,2 16,8 C22,2 29,4 29,10 C29,20 16,28 16,28 Z" fill="#ea6a88" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
            </svg>
        </div>
    </div>
    
    <div class="instruction" id="instruction-text">
        💌 Nhấn vào phong thư để xem nhé! 💌
    </div>

   
    <audio id="bg-music" loop>
        <source src="hon-ca-yeu.mp3" type="audio/mpeg">
    </audio>

    <script>
        const welcomeScreen = document.getElementById('welcome');
        const startBtn = document.getElementById('start-btn');
        const envelope = document.getElementById('envelope');
        const overlay = document.getElementById('overlay');
        const instruction = document.getElementById('instruction-text');
        const music = document.getElementById('bg-music');
        let isOpen = false;

       
        startBtn.addEventListener('click', () => {
            music.play();
            welcomeScreen.style.opacity = '0';
            welcomeScreen.style.visibility = 'hidden';
        });

      
        envelope.addEventListener('click', () => {
            if (!isOpen) {
                envelope.classList.add('open'); 
                overlay.classList.add('show');  
                instruction.style.opacity = '0'; 
                isOpen = true;
            }
        });

       
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.style.left = Math.random() * 100 + 'vw';
            
            const duration = Math.random() * 3 + 4;
            heart.style.animationDuration = duration + 's';
            
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, duration * 1000);
        }
        setInterval(createHeart, 400);
    </script>
</body>
</html>
